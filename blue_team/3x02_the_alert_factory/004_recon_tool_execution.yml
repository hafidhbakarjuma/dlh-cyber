title: Unauthorized Discovery and Reconnaissance Tool Execution
id: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
status: experimental
description: >
    Detects execution of system discovery and reconnaissance binaries (whoami.exe,
    net.exe, systeminfo.exe, tasklist.exe, netstat.exe, nmap) that were not observed
    during the 3x01 baseline monitoring window (baseline_seen: false). Cited from the
    3x01 anomaly report.
references:
    - 301 Baseline Anomaly Report
author: SOC Analyst - MedDefense Health Systems
date: 2026/09/05
modified: 2026/09/05
logsource:
    category: process_creation
detection:
    selection_windows:
        product: windows
        Image|endswith:
            - '\whoami.exe'
            - '\net.exe'
            - '\systeminfo.exe'
            - '\tasklist.exe'
            - '\netstat.exe'
    selection_linux:
        product: linux
        Image|endswith:
            - '/whoami'
            - '/nmap'
            - '/netstat'
    condition: (selection_windows or selection_linux)
falsepositives:
    - Administrative scripts or endpoint troubleshooting tools run by IT staff outside baseline window.
level: medium
tags:
    - attack.discovery
    - attack.t1087
    - attack.t1082
