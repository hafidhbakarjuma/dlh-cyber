## Section E — Kerberos Trust Surface

### ERAD-012

- **target_host:** domain
- **description:** Evaluate and, if justified, perform controlled double-reset of the krbtgt account.
- **command_or_action:** Obtain AD incident commander approval; coordinate two krbtgt password resets with full domain controller replication between resets.
- **rationale:** Compromised Kerberos trust material requires investigation for forged-ticket capability. Pass-the-Ticket alone does not prove krbtgt key compromise. Double-reset is justified if krbtgt material or Golden Ticket capability is confirmed, following domain-wide impact assessment.
- **verification_command:** Verify both password reset events, replication completion across domain controllers, and Kerberos authentication logs.
- **expected_verification_result:** Two approved resets completed with replication verified; old krbtgt-key tickets no longer accepted.
- **status:** pending
- **executed_at:** null
- **executed_by:** null

