playbook_id: "PB-CRED-001"
title: "Credential Exposure and Phishing Response Playbook"
owner_role: "Technical_Lead"

applies_to:
  triggers:
    - "Azure AD sign-in from foreign IP or impossible travel following phishing link click"
    - "Confirmed credential submission on external phishing domain reported via SOC ticket"
  indicators:
    - "Suspicious User-Agent / foreign ASN sign-in within 1 hour of credential theft"
    - "Anomalous mailbox access rule creation or bulk data export activity"

severity_mapping:
  initial: "SEV2"
  escalate_if:
    - "Attacker accessed ePHI or clinical patient databases during exposure window"
    - "Lateral movement detected from compromised user account to domain-joined assets"

immediate_actions:

  step: "Verify initial alert context, confirm user identity, and establish exact exposure timeline"
  owner: "Technical_Lead"
  timebox_minutes: 15

evidence_preservation:

  - artifact: "Authentication logs and Azure AD sign-in log export"
    method: "Export raw sign-in and audit logs via Microsoft Graph API and Azure Sentinel query"
    before_step: "Azure AD session revocation and password reset"

  - artifact: "Affected mailbox export and message trace"
    method: "Exchange Online Compliance Center content search export"
    before_step: "Mailbox rule purging and password reset"

  - artifact: "Recent data access audit export (SharePoint, OneDrive, and Epic)"
    method: "Export SharePoint/OneDrive file access logs and Epic clinical record audit reports"
    before_step: "Account isolation and session termination"

containment_actions:

  - step: "Evaluate containment trade-off decision point"
    owner: "Technical_Lead"
    decision_point: "Determine whether to reset credentials and terminate sessions immediately (losing real-time attacker session visibility and live telemetry) versus monitoring briefly under strict EDR isolation to capture complete attacker tradecraft and IOCs."
    trade_off: "Immediate reset stops active breach instantly but sacrifices live session telemetry; brief monitoring risks further data exfiltration or lateral movement."

  - step: "Active Directory password reset"
    owner: "Technical_Lead"
    decision_point: "Confirm user identity through department manager if offline verification is required"
    trade_off: "Stops active authentication immediately but disrupts legitimate user workflows"

  - step: "Azure AD session revocation"
    owner: "Technical_Lead"
    decision_point: "None"
    trade_off: "Invalidates all active refresh and access tokens instantly across cloud services"

  - step: "MFA device reset"
    owner: "Technical_Lead"
    decision_point: "None"
    trade_off: "Forces user re-registration of multi-factor authentication security tokens"

  - step: "VPN token revocation"
    owner: "Technical_Lead"
    decision_point: "None"
    trade_off: "Terminates remote network access connection immediately"

  - step: "Epic session termination"
    owner: "Technical_Lead"
    decision_point: "Verify active clinical workflows with clinical supervisor to prevent patient care disruption"
    trade_off: "Terminates electronic health record session, requiring clinical re-authentication"

eradication_actions:

  - "Revoke unauthorized OAuth application permissions, refresh tokens, and active API integrations"

  - "Delete malicious inbox forwarding rules, hidden mailbox rules, and unauthorized external contacts"

recovery_validation:

  check: "Verify clean authentication sign-in stream and zero active attacker sessions"
  criterion: "Zero unauthorized sign-ins from foreign IPs and successful user re-authentication with verified MFA for 2 consecutive hours"

communication_plan:

  - audience: "Legal_Liaison"
    trigger: "Confirmation that ePHI was accessed or exported during the compromise window"
    template: "legal_hipaa_notification_template.txt"

  - audience: "IR_Commander"
    trigger: "Completion of containment actions and verification of session termination"
    template: "incident_status_update_template.txt"

escalation_triggers:

  - "Attacker accessed electronic Protected Health Information (ePHI) during exposure window"

  - "Evidence indicates lateral movement to clinical production servers"

post_incident_tasks:

  - "Initiate HIPAA breach notification assessment with Legal Counsel"

  - "Conduct root-cause analysis on phishing lure effectiveness and tune conditional access policies"
